<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>楽楽連絡</title>

<style>
  :root{
    --teal:#0f766e; --amber:#E8A33D; --amber-ink:#B87415;
    --paper:#EDEFE6; --ink:#243330; --muted:#6b7a74; --line:#e3e5dd;
    --round:'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(#cfd6c9 1px,transparent 1px);
    background-size:18px 18px;
    overscroll-behavior:none;
  }
  #app{display:flex;flex-direction:column;height:100dvh}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .center{display:flex;align-items:center;justify-content:center;height:100dvh;padding:20px}
  .card{background:#fff;border-radius:24px;box-shadow:0 8px 30px rgba(36,51,48,.12);padding:26px;width:100%;max-width:400px;max-height:88dvh;overflow-y:auto}
  .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--teal);margin:0 0 6px}
  h1{font-family:var(--round);font-size:22px;margin:0 0 20px;line-height:1.4}
  label{display:block;font-size:14px;margin-bottom:8px}
  input[type=text],textarea{width:100%;padding:13px 16px;border-radius:16px;border:none;background:#f2f3ef;font:inherit;color:var(--ink)}
  .avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:20px}
  .avatars button{font-size:20px;padding:6px 0;border-radius:12px}
  .avatars button[aria-pressed=true]{background:#ccfbf1}
  .note{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 20px}
  .primary{width:100%;padding:14px;border-radius:16px;background:var(--teal);color:#fff;font-weight:600}
  .primary:disabled{opacity:.35}
  .steps{font-size:14px;line-height:1.9;padding-left:20px;margin:0 0 16px}
  code{background:#f2f3ef;padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}

  /* ---- グループ一覧 ---- */
  .homehead{padding:calc(16px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:flex-end;gap:10px}
  .homehead h1{margin:0;font-size:24px;flex:1}
  .rooms{flex:1;overflow-y:auto;padding:0 16px 8px}
  .room-item{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(36,51,48,.07);text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .room-item .dot{width:38px;height:38px;border-radius:12px;background:#ccfbf1;color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .room-item .nm{font-family:var(--round);font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .room-item .arrow{color:#b7c0ba;font-size:15px}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 14px}
  .joinbox{background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-shrink:0}
  .joinrow{display:flex;gap:8px}
  .joinrow input{flex:1}
  .joinrow button{padding:0 20px;border-radius:16px;background:var(--teal);color:#fff;font-weight:600;flex-shrink:0}
  .joinrow button:disabled{opacity:.35}
  .emptyroom{text-align:center;color:var(--muted);padding:40px 20px}
  .emptyroom .big{font-size:38px;margin-bottom:10px}

  /* ---- 削除シート ---- */
  .veil{position:fixed;inset:0;background:rgba(36,51,48,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:50}
  .sheet{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:400px}
  .sheet h2{font-family:var(--round);font-size:18px;margin:0 0 8px}
  .sheet p{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 18px}
  .sheet .del{width:100%;padding:14px;border-radius:16px;background:#FDECEC;color:#9B2C2C;font-weight:600;margin-bottom:8px}
  .sheet .cancel{width:100%;padding:14px;border-radius:16px;background:#f2f3ef;color:var(--ink)}

  /* ---- ヘッダー ---- */
  header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--teal);color:#fff;flex-shrink:0}
  header .back{font-size:20px;padding:2px 6px;flex-shrink:0}
  .room{font-family:var(--round);font-size:18px;line-height:1.2;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11px;opacity:.8;margin:2px 0 0}

  /* ---- お知らせ ---- */
  #pinned{padding:12px 16px 0;flex-shrink:0}
  .memo{position:relative;background:#fff;border-left:5px solid var(--amber);border-radius:8px;padding:12px 14px;box-shadow:0 2px 8px rgba(36,51,48,.08);transform:rotate(-.6deg);display:flex;gap:8px;align-items:flex-start}
  .memo .tape{position:absolute;top:-8px;left:30px;width:56px;height:16px;background:rgba(232,163,61,.35);border-radius:2px}
  .memo-label{font-size:11px;color:var(--amber-ink);margin:0 0 4px}
  .memo-body{font-size:14px;margin:0;white-space:pre-wrap;word-break:break-word}

  /* ---- トーク ---- */
  #log{flex:1;overflow-y:auto;padding:14px 16px 6px;-webkit-overflow-scrolling:touch}
  .day{display:flex;justify-content:center;margin:16px 0}
  .day span{font-size:11px;padding:4px 12px;border-radius:999px;background:rgba(36,51,48,.08);color:#5b6a64}
  .row{display:flex;gap:8px;margin-top:6px;align-items:flex-end}
  .row.mine{flex-direction:row-reverse}
  .face{width:32px;flex-shrink:0;font-size:20px;text-align:center;line-height:1}
  .stack{max-width:76%;display:flex;flex-direction:column}
  .row.mine .stack{align-items:flex-end}
  .who{font-size:11px;color:#5b6a64;margin:0 0 4px 4px}
  .bubble{padding:9px 14px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 3px rgba(36,51,48,.08);background:#fff;border-radius:18px 18px 18px 4px;text-align:left}
  .mine .bubble{background:var(--teal);color:#fff;border-radius:18px 18px 4px 18px}
  .sticker{font-size:52px;line-height:1;padding:4px;box-shadow:none;background:none!important}
  .stamp{font-size:10px;color:#8b968f;flex-shrink:0;padding-bottom:3px}
  .rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .rx button{font-size:12px;padding:2px 9px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(36,51,48,.1);border:1.5px solid transparent}
  .rx button.on{border-color:var(--teal)}
  .picker{display:flex;gap:2px;margin-top:5px;background:#fff;border-radius:999px;padding:4px 8px;box-shadow:0 3px 12px rgba(36,51,48,.16);width:max-content}
  .picker button{font-size:19px;padding:2px 4px;border-radius:999px}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:10px}
  .empty h2{font-family:var(--round);font-size:16px;color:var(--ink);margin:0 0 4px}

  /* ---- 入力 ---- */
  .stickers{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);flex-shrink:0}
  .stickers button{font-size:24px;padding:8px 0;border-radius:12px}
  footer{background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));flex-shrink:0}
  .toggle{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:999px;background:#f2f3ef;color:var(--muted);margin-bottom:8px}
  .toggle.on{background:#FDF0DC;color:var(--amber-ink)}
  .compose{display:flex;align-items:flex-end;gap:8px}
  .icon{font-size:22px;padding:4px 6px;line-height:1}
  #text{flex:1;resize:none;max-height:110px;border-radius:18px}
  #send{width:42px;height:42px;border-radius:999px;background:var(--teal);color:#fff;font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #send:disabled{opacity:.3}
  #send.notice{background:var(--amber)}
  #err{font-size:12px;background:#FDECEC;color:#9B2C2C;padding:8px 12px;border-radius:12px;margin:0 16px 8px;display:none}
  .memberline{font-size:11px;opacity:.85;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pencil{font-size:14px;padding:2px 6px;opacity:.9;flex-shrink:0}
  .photo{max-width:220px;border-radius:16px;display:block;box-shadow:0 1px 3px rgba(36,51,48,.12);background:#e8ebe4}
  .seen{font-size:10px;color:#8b968f;margin:3px 4px 0;line-height:1.5;max-width:200px}
  .row.mine .seen{text-align:right}
  .memberline button{color:inherit;text-decoration:underline;padding:0 2px;font-size:11px}
  .room-item .dot.dm{background:#FDE7EF;color:#C2447A}
  .room-item .badge{background:#D64545;color:#fff;font-size:11px;font-weight:600;min-width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
  .toast{position:fixed;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top));z-index:80;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 6px 24px rgba(36,51,48,.22);display:flex;gap:10px;align-items:center;max-width:420px;margin:0 auto}
  .toast .tx{flex:1;min-width:0}
  .toast .t1{font-family:var(--round);font-size:13px;margin:0}
  .toast .t2{font-size:12px;color:var(--muted);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mysticker{max-width:130px;max-height:130px;display:block;border-radius:10px}
  .drawwrap{position:fixed;inset:0;z-index:140;background:#20302c;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:10px}
  .drawwrap canvas{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.4);touch-action:none;max-width:100%;max-height:58vh}
  .drawwrap .chk{background-image:linear-gradient(45deg,#e7eae4 25%,transparent 25%),linear-gradient(-45deg,#e7eae4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7eae4 75%),linear-gradient(-45deg,transparent 75%,#e7eae4 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
  .tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:460px}
  .tools button{background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-family:var(--round)}
  .tools button.on{background:#fff;color:#20302c;font-weight:700}
  .swatch{width:34px;height:34px;border-radius:999px;padding:0;border:3px solid rgba(255,255,255,.3)}
  .swatch.on{border-color:#fff;transform:scale(1.12)}
  .drawwrap .go{background:var(--teal);color:#fff;font-weight:700;padding:12px 30px;border-radius:999px;font-size:15px}
  .drawwrap .quit{color:rgba(255,255,255,.75);font-size:13px;padding:8px}
  .keyword{font-size:11px;opacity:.8;font-weight:400;margin-left:5px}
  .memberline{cursor:pointer}
  .mlist button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:#f4f6f1;margin-bottom:8px;font-size:15px}
  .viewer{position:fixed;inset:0;z-index:120;background:rgba(12,20,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  .viewer img{max-width:100%;max-height:78vh;border-radius:14px;object-fit:contain}
  .viewer .vrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .viewer .vrow button{background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:9px 15px;font-size:18px}
  .viewer .vclose{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;color:#fff;font-size:26px;padding:6px 12px}
  .viewer .vnote{color:rgba(255,255,255,.7);font-size:12px;margin-top:12px}
  .busy{position:fixed;left:0;right:0;top:0;z-index:130;background:var(--teal);color:#fff;font-size:13px;text-align:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;font-family:var(--round)}
  textarea.note-in{width:100%;min-height:110px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;font-size:15px;resize:none;margin-bottom:12px;background:#fff;color:var(--ink)}
  .inbox-item{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(36,51,48,.08)}
  .inbox-item .ih{font-size:11px;color:var(--muted);margin:0 0 5px}
  .inbox-item .ib{font-size:14px;margin:0;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .crown{font-size:11px;margin-left:3px}
  .alertbox{background:#FFF4E0;border:2px solid var(--amber);border-radius:18px;padding:16px;margin:0 0 14px}
  .alertbox h3{font-family:var(--round);font-size:15px;color:var(--amber-ink);margin:0 0 6px}
  .alertbox p{font-size:13px;color:#7a5a12;margin:0 0 10px;line-height:1.7}
  .alertbox button{background:var(--amber);color:#fff;border-radius:999px;padding:8px 18px;font-weight:600;font-size:13px}
  .danger{background:#D64545;color:#fff}
  .danger2{background:#9B2C2C;color:#fff}
  .sep{border:none;border-top:1px solid var(--line);margin:20px 0 16px}
  .small{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 12px}
  .warn{font-size:12px;color:#9B2C2C;background:#FDECEC;border-radius:12px;padding:8px 12px;margin:-12px 0 16px;line-height:1.6}
  /* ---- 誕生日 ---- */
  .bday{background:#fff;border-radius:16px;padding:14px 16px;margin:0 0 10px;box-shadow:0 2px 8px rgba(36,51,48,.08);border-left:5px solid #E86FA3}
  .bday .ttl{font-family:var(--round);font-size:15px;margin:0 0 4px;color:#C2447A}
  .bday .sub2{font-size:12px;color:var(--muted);margin:0 0 10px}
  .bday .go{padding:9px 16px;border-radius:14px;background:#E86FA3;color:#fff;font-size:13px;font-weight:600}
  .cards{display:flex;flex-direction:column;gap:10px;margin:12px 0}
  .card-msg{border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(36,51,48,.1)}
  .card-msg .from{font-size:11px;opacity:.75;margin:0 0 6px}
  .card-msg .body{font-size:14px;margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.7}
  .colors{display:flex;gap:8px;margin-bottom:18px}
  .colors button{flex:1;height:42px;border-radius:14px;border:3px solid transparent}
  .colors button[aria-pressed=true]{border-color:var(--ink)}
  .bday-cake{text-align:center;font-size:40px;margin:6px 0}
  .bday-title{font-family:var(--round);font-size:19px;text-align:center;margin:0 0 14px}

  /* ---- ボイス ---- */
  .voice{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:18px;background:#fff;box-shadow:0 1px 3px rgba(36,51,48,.08);min-width:150px}
  .mine .voice{background:var(--teal);color:#fff}
  .voice .play{font-size:20px;flex-shrink:0}
  .voice .wave{flex:1;height:22px;display:flex;align-items:center;gap:2px}
  .voice .wave i{flex:1;background:currentColor;opacity:.4;border-radius:2px;display:block}
  .voice .len{font-size:11px;opacity:.8;flex-shrink:0}
  .recbar{display:flex;align-items:center;gap:10px;background:#FDECEC;color:#9B2C2C;border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:13px}
  .recbar .dot2{width:10px;height:10px;border-radius:999px;background:#D64545;flex-shrink:0}
  .recbar .stop{margin-left:auto;padding:6px 14px;border-radius:12px;background:#D64545;color:#fff;font-size:12px}
  .micbtn.on{color:#D64545}
</style>
</head>

<script type="module">
/* ==========================================================
   Firebase の設定
   ========================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCzpAJAmqorxAzplZca57Q9wsO-z6jJ4TY",
  authDomain: "rakuraku-1e398.firebaseapp.com",
  databaseURL: "https://rakuraku-1e398-default-rtdb.asia-southeast1.firebasedatabase.app",

  messagingSenderId: "571906665311",

};
/* ========================================================== */

const AVATARS = ["🐻","🐱","🐶","🦊","🐼","🐰","🐯","🐨","🦁","🐷","🐸","🐵","🦉","🐧","🐝","🦄"];
const STICKERS = ["👍","🎉","😂","🥹","👏","🙏","✨","💪","🍵","🌸","☕️","😴","🙌","❤️","😭","🔥"];
const REACTIONS = ["👍","❤️","😂","🎉","🙏","😮"];
const DAYS = ["日","月","火","水","木","金","土"];
const CARD_COLORS = [
  { id:"pink",  bg:"#FDE7EF", ink:"#8E2A55" },
  { id:"blue",  bg:"#E3F0FA", ink:"#1F5878" },
  { id:"yellow",bg:"#FCF3DA", ink:"#7A5A16" },
  { id:"green", bg:"#E6F3E9", ink:"#255B37" }
];
const MAX_MSGS = 120;
const MAX_REC_SEC = 10;

const app = document.getElementById("app");
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const esc = (s) => (s || "").replace(/[.#$/[\]]/g, "_").slice(0, 30);

const prettyMD = (s) => s ? Number(s.slice(0,2)) + "月" + Number(s.slice(2,4)) + "日" : "";

if (!firebaseConfig.apiKey || !firebaseConfig.databaseURL) {
  app.innerHTML = '<div class="center"><div class="card"><h1>設定がまだです</h1></div></div>';

let db, fb;
try {

try { isAdmin = localStorage.getItem("admin") === "1"; } catch (e) {}

let busyEl = null;
function busy(on, label) {
  if (busyEl) { busyEl.remove(); busyEl = null; }
  if (on) {
    busyEl = el("div", "busy", label || "アップデート中…");

const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };

let me = load("me", null);

let messages = [], reactions = {}, members = {}, cards = {};
let openPicker = null, noticeMode = false, stickersOpen = false, pinnedHidden = false;

let warns = {};
let rec = null, recTimer = null, recStart = 0, playing = null;

/* ========== 1. 名前と誕生日 ========== */
/* 感想・通報を送る */
function openNote(kind) {
  const isReport = kind === "report";
  const veil = el("div", "veil"), sheet = el("div", "sheet");
  sheet.appendChild(el("h2", null, isReport ? "通報する" : "フィードバックを送信する"));
  sheet.appendChild(el("p", null, isReport ? "何がいけなかったですか？" : "使ってみての感想などを書いてね。"));
  const ta = document.createElement("textarea");
  ta.className = "note-in";
  ta.maxLength = 600;
  ta.placeholder = isReport ? "できるだけくわしく書いてね" : "こんな機能がほしい、ここが使いにくい、など";
  sheet.appendChild(ta);
  if (isReport) sheet.appendChild(el("p", "small", "こわい思いをしたときや、ひどいことをされたときは、アプリだけで終わらせないで、おうちの人にも話してね。"));

  const ok = el("button", "primary", "送る");
  ok.style.marginBottom = "8px";
  ok.onclick = async () => {
    const t = ta.value.trim();
    if (!t) return;
    ok.disabled = true; ok.textContent = "送信中…";
    try {
      await fb.push(fb.ref(db, isReport ? "reports" : "feedback"), {
        text: t.slice(0, 600),
        name: me ? me.name : "だれか",
        uid: me ? me.uid : "",
        room: current || "",
        t: Date.now()
      });
      veil.remove();
      fail("");
      alert(isReport ? "通報を送ったよ。ありがとう。" : "送ったよ。ありがとう！");
    } catch (e) {
      ok.disabled = false; ok.textContent = "送る";
      fail("送れませんでした。もう一度おしてみてね。");
    }
  };
  const no = el("button", "cancel", "やめる");
  no.onclick = () => veil.remove();
  sheet.appendChild(ok); sheet.appendChild(no);
  veil.onclick = (e) => { if (e.target === veil) veil.remove(); };
  veil.appendChild(sheet); app.appendChild(veil);
}

/* 管理者だけ：とどいたものを見る */
async function openInbox() {
  const veil = el("div", "veil"), sheet = el("div", "sheet");
  sheet.appendChild(el("h2", null, "とどいたもの"));
  const box = el("div");
  box.appendChild(el("p", "small", "読みこみ中…"));
  sheet.appendChild(box);
  const no = el("button", "cancel", "とじる");
  no.onclick = () => veil.remove();
  sheet.appendChild(no);
  veil.onclick = (e) => { if (e.target === veil) veil.remove(); };
  veil.appendChild(sheet); app.appendChild(veil);

  try {
    const [rs, fs2] = await Promise.all([
      fb.get(fb.ref(db, "reports")),
      fb.get(fb.ref(db, "feedback"))
    ]);
    const list = [];
    Object.values(rs.val() || {}).forEach(x => list.push(Object.assign({ kind: "🚩 通報" }, x)));
    Object.values(fs2.val() || {}).forEach(x => list.push(Object.assign({ kind: "💬 感想" }, x)));
    list.sort((a, b) => (b.t || 0) - (a.t || 0));

    box.innerHTML = "";
    if (!list.length) { box.appendChild(el("p", "small", "まだ何もとどいてないよ。")); return; }
    list.slice(0, 30).forEach(x => {
      const it = el("div", "inbox-item");
      const d = new Date(x.t || 0);
      it.appendChild(el("p", "ih", x.kind + "・" + (x.name || "だれか") + "・" + (d.getMonth() + 1) + "/" + d.getDate()));
      it.appendChild(el("p", "ib", x.text || ""));
      box.appendChild(it);
    });
  } catch (e) {
    box.innerHTML = "";
    box.appendChild(el("p", "small", "読みこめませんでした。"));
  }
}

/* ぜんぶ消す */
function doLogout() {
  try { stopWatch(); } catch (e) {}
  try { if (current) trim(); } catch (e) {}
  try {
    rooms.forEach(r => { try { fb.remove(fb.ref(db, `rooms/${r}/members/${me.uid}`)); } catch (e) {} });
  } catch (e) {}
  try {
    localStorage.clear();
    isAdmin = false;
  } catch (e) {}
  location.reload();
}

/* 入ってるグループに同じ名前の人がいないか調べる（自分は除く） */
async function nameTaken(name) {
  const myUid = me?.uid;
  for (const room of rooms) {
    try {
      const snap = await fb.get(fb.ref(db, `rooms/${room}/members`));
      const v = snap.val() || {};
      for (const [u, m] of Object.entries(v)) {
        if (u !== myUid && m && m.name === name) return room;
      }
    } catch (e) {}
  }
  return null;
}

/* グループに入るときも、同じ名前がいないか調べる */
async function nameTakenIn(room) {
  try {
    const snap = await fb.get(fb.ref(db, `rooms/${room}/members`));
    const v = snap.val() || {};
    for (const [u, m] of Object.entries(v)) {
      if (u !== me.uid && m && m.name === me.name) return true;
    }
  } catch (e) {}
  return false;
}

/* 今ここまで読んだ、を記録する */
let seenTimer = null;
function markSeen() {
  if (!current || !messages.length) return;
  const last = messages[messages.length - 1];
  if (seenTimer) clearTimeout(seenTimer);
  seenTimer = setTimeout(() => {
    try { fb.set(fb.ref(db, `rooms/${current}/members/${me.uid}/seenAt`), last.t); } catch (e) {}
  }, 800);
}

function pushMember(room) {
  try {
    fb.update(fb.ref(db, `rooms/${room}/members/${me.uid}`), {
      name: me.name, avatar: me.avatar, bday: me.bday || "", seen: Date.now(), admin: isAdmin || null
    });
  } catch (e) {}
}

  const prof = el("button", "room-item", me.avatar + " " + me.name);

    e.appendChild(el("p", null, "下にあいことばを入れて入ろう。"));

  } else {
    list.appendChild(el("p", "hint", "タップで入る・長おしで消す"));

      warn2.textContent = "そのグループに「" + me.name + "」さんがもういるよ。名前を変えてから入ってね。";
      warn2.style.display = "block";

      return;
    }
    btn.textContent = "入る";

    openRoom(name);
  };
  inp.oninput = () => { btn.disabled = !inp.value.trim(); warn2.style.display = "none"; };
  inp.onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); enter(); } };
  btn.onclick = enter;
  row.appendChild(inp); row.appendChild(btn); box.appendChild(row);

  box.appendChild(warn2);
  box.appendChild(el("p", "hint", "同じあいことばの人と同じ部屋になるよ"));
  app.appendChild(box);
}

function longPress(node, ms, fn) {
  let timer = null, fired = false;
  const start = () => { fired = false; timer = setTimeout(() => { fired = true; fn(); }, ms); };
  const stop = () => { if (timer) clearTimeout(timer); timer = null; };
  node.addEventListener("touchstart", start, { passive: true });
  node.addEventListener("touchend", stop);
  node.addEventListener("touchmove", stop, { passive: true });
  node.addEventListener("touchcancel", stop);
  node.addEventListener("mousedown", start);
  node.addEventListener("mouseup", stop);
  node.addEventListener("mouseleave", stop);
  node.addEventListener("contextmenu", (e) => e.preventDefault());
  return () => fired;
}

function roomButton(name) {
  const b = el("button", "room-item");
  b.dataset.room = name;
  b.appendChild(el("div", "dot" + (isDM(name) ? " dm" : ""), isDM(name) ? "👤" : "💬"));
  b.appendChild(el("div", "nm", roomLabel(name)));
  const n = unread[name] || 0;
  if (n > 0) b.appendChild(el("div", "badge", n > 99 ? "99+" : String(n)));
  b.appendChild(el("div", "arrow", "›"));
  const wasLong = longPress(b, 1000, () => askDelete(name));
  b.onclick = () => { if (!wasLong()) openRoom(name); };
  return b;
}

function askDelete(name) {
  const veil = el("div", "veil"), sheet = el("div", "sheet");

  sheet.appendChild(el("p", null, "リストから消えるだけで、トークの中身は残ってるよ。もう一度おなじあいことばを入れれば、また入れる。"));
  const del = el("button", "del", "リストから消す");
  del.onclick = () => { rooms = rooms.filter(r => r !== name); store("rooms", rooms); veil.remove(); showHome(); };
  const cancel = el("button", "cancel", "やめる");
  cancel.onclick = () => veil.remove();
  veil.onclick = (e) => { if (e.target === veil) veil.remove(); };
  sheet.appendChild(del); sheet.appendChild(cancel);
  veil.appendChild(sheet); app.appendChild(veil);
}

/* ========== 3. トーク ========== */
function openRoom(name) {
  current = name;
  unread[name] = 0;
  lastSeen[name] = Date.now();
  store("lastSeen", lastSeen);
  messages = []; reactions = {}; members = {}; cards = {};
  openPicker = null; noticeMode = false; stickersOpen = false; pinnedHidden = false;
  pushMember(name);
  showChat();
}

function leaveRoom() {
  [offMsgs, offRx, offMem, offCards, offTitle, offWarns].forEach(f => { if (f) f(); });
  offMsgs = offRx = offMem = offCards = offTitle = offWarns = null;
  warns = {};
  stopRec(true);
  lastSeen[current] = Date.now();
  store("lastSeen", lastSeen);
  unread[current] = 0;
  current = null;
  showHome();
}

    textIn.style.height = Math.min(textIn.scrollHeight, 110) + "px";

  listen();
}

/* ---- 120件を超えたら古いのを消す ---- */
async function trim(room) {
  try {
    const extra = messages.length - MAX_MSGS;
    if (extra <= 0) return;
    const old = messages.slice(0, extra);
    for (const m of old) {
      await fb.remove(fb.ref(db, `rooms/${room}/messages/${m.id}`));
      if (reactions[m.id]) await fb.remove(fb.ref(db, `rooms/${room}/reactions/${m.id}`));
    }
  } catch (e) {}
}

async function send(type, body, extra) {
  const HEAVY = ["voice", "photo", "mysticker"];
  const b = HEAVY.indexOf(type) !== -1 ? body : (body || "").trim();
  if (!b || !current) return;
  const room = current;
  const textIn = document.getElementById("text");
  try {
    const msg = Object.assign({
      uid: me.uid, name: me.name, avatar: me.avatar, type,
      body: HEAVY.indexOf(type) !== -1 ? b : b.slice(0, 1000), t: Date.now()
    }, extra || {});
    await fb.push(fb.ref(db, `rooms/${room}/messages`), msg);
    if (type === "text" || type === "notice") {
      textIn.value = ""; textIn.style.height = "auto";
      document.getElementById("send").disabled = true;
    }
    if (noticeMode) document.getElementById("noticeBtn").click();
    if (stickersOpen) document.getElementById("stickerBtn").click();
    pinnedHidden = false;
    fail("");
    trim(room);
  } catch (e) {
    fail(type === "voice" ? "声が長すぎたか、送れませんでした。" : (type === "photo" ? "写真を送れませんでした。" : "送れませんでした。もう一度おしてみてね。"));
  }
}

async function react(msgId, emoji) {
  const path = fb.ref(db, `rooms/${current}/reactions/${msgId}/${me.uid}`);
  const mine = reactions[msgId]?.[me.uid];
  openPicker = null;
  try { mine === emoji ? await fb.remove(path) : await fb.set(path, emoji); }
  catch (e) { fail("リアクションをつけられませんでした。"); }
}

/* ========== おしらせ ========== */
const lastSeen = load("lastSeen", {});
const unread = {};
const roomTitles = load("roomTitles", {});
let watchers = [];

function stopWatch() { watchers.forEach(f => { try { f(); } catch (e) {} }); watchers = []; }

function startWatch() {
  stopWatch();
  rooms.forEach(room => {
    watchers.push(fb.onValue(fb.query(fb.ref(db, `rooms/${room}/messages`), fb.limitToLast(30)), (snap) => {
      const v = snap.val() || {};
      const list = Object.values(v).filter(m => m && m.uid !== me.uid);
      const since = lastSeen[room] || 0;
      const fresh = list.filter(m => (m.t || 0) > since);
      const before = unread[room] || 0;
      unread[room] = fresh.length;
      if (room !== current && fresh.length > before && before >= 0) {
        const newest = fresh.sort((a,b) => b.t - a.t)[0];
        if (newest) toast(room, newest);
      }
      if (!current) paintBadges();
    }));

    watchers.push(fb.onValue(fb.ref(db, `rooms/${room}/title`), (snap) => {
      const t = snap.val();
      if (t) roomTitles[room] = t; else delete roomTitles[room];
      store("roomTitles", roomTitles);
      if (!current) paintBadges();
    }));
  });
}

/* ========== おえかき ========== */
const PENS = ["#243330", "#D64545", "#E8A33D", "#0f766e", "#3B6FD4", "#C2447A", "#7A4FBF", "#ffffff"];

const BGS = ["#0f766e", "#E8A33D", "#D64545", "#3B6FD4", "#C2447A", "#7A4FBF", "#243330", "#ffffff"];

function openDraw(opts) {
  const bg = opts.bg || null;
  let fillColor = opts.fill || null;
  const wrap = el("div", "drawwrap");
  const cv = document.createElement("canvas");
  if (!bg) cv.className = "chk";
  const ctx = cv.getContext("2d");

  let color = PENS[0], width = 8, eraser = false;
  const undos = [];

  const setup = () => {
    if (bg) {
      const im = new Image();
      im.onload = () => {
        const w = Math.min(800, im.width), h = Math.round(im.height * (w / im.width));
        cv.width = w; cv.height = h;
        ctx.drawImage(im, 0, 0, w, h);
        snap();
      };
      im.src = bg;
    } else {
      cv.width = 420; cv.height = 420;
      ctx.clearRect(0, 0, cv.width, cv.height);
      if (fillColor) { ctx.fillStyle = fillColor; ctx.fillRect(0, 0, cv.width, cv.height); }
      snap();
    }
  };
  const snap = () => { try { undos.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undos.length > 12) undos.shift(); } catch (e) {} };

  let drawing = false, lastX = 0, lastY = 0;
  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - r.left) * (cv.width / r.width), y: (t.clientY - r.top) * (cv.height / r.height) };
  };
  const begin = (e) => { e.preventDefault(); snap(); drawing = true; const p = pos(e); lastX = p.x; lastY = p.y; stroke(p.x, p.y); };
  const move = (e) => { if (!drawing) return; e.preventDefault(); const p = pos(e); stroke(p.x, p.y); };
  const end = () => { drawing = false; };
  const stroke = (x, y) => {
    ctx.globalCompositeOperation = eraser ? "destination-out" : "source-over";
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
    lastX = x; lastY = y;
  };
  cv.addEventListener("touchstart", begin, { passive: false });
  cv.addEventListener("touchmove", move, { passive: false });
  cv.addEventListener("touchend", end);
  cv.addEventListener("mousedown", begin);
  cv.addEventListener("mousemove", move);
  cv.addEventListener("mouseup", end);
  cv.addEventListener("mouseleave", end);

  wrap.appendChild(el("p", null, opts.title || "ゆびでかいてね")).style.cssText = "color:#fff;font-size:14px;margin:0;font-family:var(--round)";
  wrap.appendChild(cv);

  const colors = el("div", "tools");
  const cbtns = PENS.map(c => {
    const b = el("button", "swatch" + (c === color ? " on" : ""));
    b.style.background = c;
    b.onclick = () => { color = c; eraser = false; cbtns.forEach(x => x.classList.remove("on")); b.classList.add("on"); refreshTools(); };
    colors.appendChild(b);
    return b;
  });
  wrap.appendChild(colors);

  if (opts.pickBg) {
    const bgrow = el("div", "tools");
    const bl = el("span", null, "したじ");
    bl.style.cssText = "color:rgba(255,255,255,.75);font-size:12px;align-self:center;margin-right:2px";
    bgrow.appendChild(bl);
    const bbtns = BGS.map(c => {
      const b = el("button", "swatch" + (c === fillColor ? " on" : ""));
      b.style.background = c;
      b.onclick = () => {
        fillColor = c;
        bbtns.forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        const keep = ctx.getImageData(0, 0, cv.width, cv.height);
        ctx.globalCompositeOperation = "destination-over";
        ctx.fillStyle = c;
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.globalCompositeOperation = "source-over";
      };
      bgrow.appendChild(b);
      return b;
    });
    wrap.appendChild(bgrow);
  }

  const tools = el("div", "tools");
  const sizes = [{ n: "ほそい", v: 4 }, { n: "ふつう", v: 8 }, { n: "ふとい", v: 18 }];
  const sbtns = sizes.map(sz => {
    const b = el("button", sz.v === width ? "on" : null, sz.n);
    b.onclick = () => { width = sz.v; eraser = false; refreshTools(); };
    tools.appendChild(b);
    return b;
  });
  const er = el("button", null, "けしゴム");
  er.onclick = () => { eraser = !eraser; refreshTools(); };
  tools.appendChild(er);
  const un = el("button", null, "もどす");
  un.onclick = () => { if (undos.length > 1) { undos.pop(); ctx.putImageData(undos[undos.length - 1], 0, 0); } };
  tools.appendChild(un);
  const cl = el("button", null, "ぜんぶ消す");
  cl.onclick = () => { snap(); if (bg) { setup(); } else { ctx.clearRect(0, 0, cv.width, cv.height); } };
  tools.appendChild(cl);
  wrap.appendChild(tools);

  const refreshTools = () => {
    sbtns.forEach((b, i) => b.classList.toggle("on", !eraser && sizes[i].v === width));
    er.classList.toggle("on", eraser);
  };

  const go = el("button", "go", opts.okLabel || "できた！");
  go.onclick = () => {
    const data = bg ? cv.toDataURL("image/jpeg", 0.8) : cv.toDataURL("image/png");
    wrap.remove();
    opts.onDone(data, cv.width, cv.height);
  };
  wrap.appendChild(go);

  const quit = el("button", "quit", "やめる");
  quit.onclick = () => wrap.remove();
  wrap.appendChild(quit);

  setup();
  app.appendChild(wrap);
}

/* ========== 写真 ========== */
const PHOTO_W = 800;
const PHOTO_HI = 1600;

function pickPhoto() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (file) shrinkAndSend(file);
  };
  inp.click();
}

function shrinkAndSend(file) {
  busy(true, "写真を用意中…");
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async () => {
    try {
      const make = (maxW, q) => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        return { data: cv.toDataURL("image/jpeg", q), w, h };
      };

      const small = make(PHOTO_W, 0.75);
      URL.revokeObjectURL(url);
      if (small.data.length > 900000) { busy(false); fail("その写真は大きすぎました。ほかのを選んでね。"); return; }

      const big = make(PHOTO_HI, 0.82);
      busy(false);
      askPhotoWay(small, big);
    } catch (e) { busy(false); fail("写真をうまく読めませんでした。"); }
  };
  img.onerror = () => { busy(false); URL.revokeObjectURL(url); fail("その写真は読めませんでした。"); };
  img.src = url;
}

  });
  v.appendChild(row);

  if (!m.hi) v.appendChild(el("p", "vnote", "この写真はキレイ版がないよ（前に送ったやつ）"));

  v.onclick = (ev) => { if (ev.target === v || ev.target === im) v.remove(); };
  app.appendChild(v);
}

/* ========== ボイスメッセージ ========== */
async function startRec() {
  if (rec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream);
    const chunks = [];
    mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const secs = Math.round((Date.now() - recStart) / 1000);
      rec = null;
      if (recTimer) { clearInterval(recTimer); recTimer = null; }
      renderCtxBar();
      document.getElementById("micBtn")?.classList.remove("on");
      if (mr.cancelled || secs < 1) return;
      const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
      if (blob.size > 700000) { fail("声が長すぎました。もう少し短くしてね。"); return; }
      const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      send("voice", b64, { secs });
    };
    rec = mr; recStart = Date.now();
    mr.start();
    document.getElementById("micBtn")?.classList.add("on");
    renderCtxBar();
    recTimer = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      const c = document.getElementById("recsec");
      if (c) c.textContent = s + "秒 / " + MAX_REC_SEC + "秒";
      if (s >= MAX_REC_SEC) stopRec();
    }, 200);
  } catch (e) {
    fail("マイクが使えませんでした。設定でマイクを許可してね。");
  }
}

function stopRec(cancel) {
  if (!rec) return;
  if (cancel) rec.cancelled = true;
  try { rec.stop(); } catch (e) {}
}

function playVoice(m, btn) {
  if (playing) { playing.pause(); playing = null; }
  const a = new Audio(m.body);
  playing = a;
  btn.textContent = "⏸";
  a.onended = () => { btn.textContent = "▶️"; playing = null; };
  a.play().catch(() => { btn.textContent = "▶️"; fail("再生できませんでした。"); });
}

/* ========== 誕生日 ========== */
function birthdayInfo() {
  const tm = tomorrowMD(), td = todayMD();
  const soon = [], today = [];
  Object.entries(members).forEach(([u, m]) => {
    if (!m.bday) return;
    if (m.bday === tm) soon.push({ uid: u, name: m.name, avatar: m.avatar });
    if (m.bday === td) today.push({ uid: u, name: m.name, avatar: m.avatar });
  });
  return { soon, today };
}

function writeCard(person) {
  let color = CARD_COLORS[0];
  const veil = el("div", "veil"), sheet = el("div", "sheet");
  sheet.appendChild(el("div", "bday-cake", "🎂"));
  sheet.appendChild(el("p", "bday-title", person.avatar + " " + person.name + " へのカード"));

  const colors = el("div", "colors");
  CARD_COLORS.forEach(c => {
    const b = el("button");
    b.style.background = c.bg;
    b.setAttribute("aria-label", "色 " + c.id);
    b.setAttribute("aria-pressed", String(c.id === color.id));
    b.onclick = () => { color = c; [...colors.children].forEach((x,i) => x.setAttribute("aria-pressed", String(CARD_COLORS[i].id === c.id))); };
    colors.appendChild(b);
  });
  sheet.appendChild(colors);

  const ta = el("textarea");
  ta.rows = 4; ta.maxLength = 300; ta.placeholder = "おめでとうのメッセージを書こう";
  ta.style.marginBottom = "16px";
  sheet.appendChild(ta);

  sheet.appendChild(el("p", null, "当日までヒミツ。誕生日の日にみんなのカードがまとめて出るよ。"));

  const ok = el("button", "primary", "カードをおくる");
  ok.style.marginBottom = "8px";
  ok.onclick = async () => {
    const body = ta.value.trim();
    if (!body) return;
    try {
      await fb.set(fb.ref(db, `rooms/${current}/cards/${person.uid}/${me.uid}`), {
        from: me.name, avatar: me.avatar, body: body.slice(0, 300), color: color.id, t: Date.now()
      });
      veil.remove();
    } catch (e) { fail("カードを送れませんでした。"); }
  };
  const cancel = el("button", "cancel", "やめる");
  cancel.onclick = () => veil.remove();
  sheet.appendChild(ok); sheet.appendChild(cancel);
  veil.onclick = (e) => { if (e.target === veil) veil.remove(); };
  veil.appendChild(sheet); app.appendChild(veil);
}

function renderBirthday(pin) {
  const { soon, today } = birthdayInfo();

  soon.forEach(p => {
    if (p.uid === me.uid) return;
    const box = el("div", "bday");
    box.appendChild(el("p", "ttl", "🎂 明日 " + p.name + " の誕生日！"));
    const mine = cards[p.uid] && cards[p.uid][me.uid];
    box.appendChild(el("p", "sub2", mine ? "カードを書いたよ。当日までヒミツ。" : "こっそりカードを書こう"));
    const b = el("button", "go", mine ? "書きなおす" : "カードを書く");
    b.onclick = () => writeCard(p);
    box.appendChild(b);
    pin.appendChild(box);
  });

  today.forEach(p => {
    const got = cards[p.uid] || {};
    const list = Object.values(got);
    const box = el("div", "bday");
    box.appendChild(el("p", "ttl", "🎉 今日は " + p.name + " の誕生日！"));
    if (p.uid === me.uid && list.length) {
      box.appendChild(el("p", "sub2", "みんなからカードが届いてるよ"));
    } else if (p.uid !== me.uid) {
      box.appendChild(el("p", "sub2", "おめでとうを伝えよう"));
      const b = el("button", "go", "カードを書く");
      b.onclick = () => writeCard(p);
      box.appendChild(b);
    }
    pin.appendChild(box);

    if (list.length) {
      const wrap = el("div", "cards");
      list.sort((a,b) => a.t - b.t).forEach(c => {
        const col = CARD_COLORS.find(x => x.id === c.color) || CARD_COLORS[0];
        const cd = el("div", "card-msg");
        cd.style.background = col.bg; cd.style.color = col.ink;
        cd.appendChild(el("p", "from", (c.avatar || "") + " " + c.from + " より"));
        cd.appendChild(el("p", "body", c.body));
        wrap.appendChild(cd);
      });
      pin.appendChild(wrap);
    }
  });
}

/* ========== 画面をえがく ========== */
function renderCtxBar() {
  const bar = document.getElementById("ctxbar");
  if (!bar) return;
  bar.innerHTML = "";
  if (rec) {
    const b = el("div", "recbar");
    b.appendChild(el("div", "dot2"));
    const s = el("div", null, "0秒 / " + MAX_REC_SEC + "秒"); s.id = "recsec";
    b.appendChild(s);
    const stop = el("button", "stop", "送る");
    stop.onclick = () => stopRec();
    b.appendChild(stop);
    bar.appendChild(b);
  }
}

function render() {
  renderCtxBar();
  const log = document.getElementById("log");
  if (!log) return;
  const stuck = log.scrollHeight - log.scrollTop - log.clientHeight < 120;

  const shown = messages.slice(-MAX_MSGS);

  const ml = document.querySelector(".memberline");
  if (ml) {
    const ents = Object.entries(members);
    const names = ents.map(([u, mm]) => mm.avatar + mm.name + (mm.admin ? "👑" : ""));
    ml.textContent = (names.length ? names.join("・") : me.avatar + me.name) + (ents.length > 1 && !isDM(current) ? "  ▸" : "");
    ml.onclick = openMembers;
  }

  const rt = document.querySelector(".room");
  if (rt) {
    rt.textContent = roomLabel(current);
    if (!isDM(current) && roomTitles[current]) rt.appendChild(el("span", "keyword", "〈" + current + "〉"));
  }

  const pin = document.getElementById("pinned");
  pin.innerHTML = "";
  renderWarn(pin);
  renderBirthday(pin);

  const notices = shown.filter(m => m.type === "notice");
  const last = notices[notices.length - 1];
  if (last && !pinnedHidden) {
    const memo = el("div", "memo");
    memo.appendChild(el("div", "tape"));
    const body = el("div"); body.style.flex = "1"; body.style.minWidth = "0";
    body.appendChild(el("p", "memo-label", "📣 お知らせ・" + (last.name || "だれか")));
    body.appendChild(el("p", "memo-body", last.body));
    memo.appendChild(body);
    const x = el("button", null, "✕");
    x.style.color = "#9aa39e"; x.style.fontSize = "13px";
    x.setAttribute("aria-label", "お知らせを閉じる");
    x.onclick = () => { pinnedHidden = true; render(); };
    memo.appendChild(x);
    pin.appendChild(memo);
  }

  log.innerHTML = "";
  if (!shown.length) {
    const e = el("div", "empty");
    e.appendChild(el("div", "big", "🍵"));
    e.appendChild(el("h2", null, "まだ何もないよ"));
    e.appendChild(el("p", null, "最初のひとことを書いてみよう。"));
    log.appendChild(e);
    return;
  }

  shown.forEach((m, i) => {
    const prev = shown[i - 1];
    if (!prev || !sameDay(prev.t, m.t)) {
      const d = el("div", "day"); d.appendChild(el("span", null, dayOf(m.t))); log.appendChild(d);
    }
    const mine = m.uid === me.uid;

    if (m.type === "notice") {
      const memo = el("div", "memo");
      memo.style.margin = "12px 0"; memo.style.transform = "none";
      const body = el("div"); body.style.flex = "1"; body.style.minWidth = "0";
      body.appendChild(el("p", "memo-label", "📣 お知らせ・" + (mine ? "自分" : m.name) + "・" + hhmm(m.t)));
      body.appendChild(el("p", "memo-body", m.body));
      memo.appendChild(body);
      log.appendChild(memo);
      return;
    }

    const row = el("div", "row" + (mine ? " mine" : ""));
    const showName = !mine && (!prev || prev.uid !== m.uid);
    if (!mine) row.appendChild(el("div", "face", showName ? m.avatar : ""));

    const stack = el("div", "stack");
    if (showName) {
      const who = el("p", "who", m.name);
      if (members[m.uid] && members[m.uid].admin) who.appendChild(el("span", "crown", "👑"));
      stack.appendChild(who);
    }

    const line = el("div");
    line.style.display = "flex"; line.style.alignItems = "flex-end"; line.style.gap = "5px";
    if (mine) line.style.flexDirection = "row-reverse";

    let bub;
    if (m.type === "photo") {
      bub = el("button");
      bub.style.padding = "0"; bub.style.background = "none"; bub.style.border = "none";
      const im = document.createElement("img");
      im.className = "photo";
      im.src = m.body;
      im.alt = "写真";
      if (m.pw && m.ph) im.style.aspectRatio = m.pw + " / " + m.ph;
      bub.appendChild(im);
      bub.onclick = () => openViewer(m);
    } else if (m.type === "mysticker") {
      bub = el("button");
      bub.style.cssText = "padding:0;background:none;border:none";
      const im = document.createElement("img");
      im.className = "mysticker";
      im.src = m.body;
      im.alt = "スタンプ";
      bub.appendChild(im);
      bub.onclick = () => { openPicker = openPicker === m.id ? null : m.id; render(); };
    } else if (m.type === "voice") {
      bub = el("button", "voice");
      const play = el("span", "play", "▶️");
      const wave = el("div", "wave");
      for (let k = 0; k < 14; k++) {
        const bar2 = document.createElement("i");
        bar2.style.height = (6 + ((k * 7 + m.t) % 16)) + "px";
        wave.appendChild(bar2);
      }
      bub.appendChild(play); bub.appendChild(wave);
      bub.appendChild(el("span", "len", (m.secs || 0) + '"'));
      bub.onclick = () => playVoice(m, play);
    } else {
      bub = el("button", "bubble" + (m.type === "sticker" ? " sticker" : ""), m.body);
      bub.onclick = () => { openPicker = openPicker === m.id ? null : m.id; render(); };
    }
    bub.setAttribute("aria-label", m.type === "voice" ? "声を再生する" : (m.type === "photo" ? "写真" : "リアクションをつける"));

    if (!mine && isAdmin) {
      const wasLong = longPress(bub, 700, () => askWarn(m));
      const orig = bub.onclick;
      bub.onclick = (ev) => { if (wasLong()) return; if (orig) orig(ev); };
    }
    line.appendChild(bub);
    line.appendChild(el("span", "stamp", hhmm(m.t)));
    stack.appendChild(line);

    const rx = reactions[m.id] || {};
    const counts = {};
    Object.keys(rx).forEach(u => { const e = rx[u]; (counts[e] = counts[e] || []).push(u); });
    if (Object.keys(counts).length) {
      const bar2 = el("div", "rx");
      Object.keys(counts).forEach(emoji => {
        const us = counts[emoji];
        const b = el("button", us.indexOf(me.uid) !== -1 ? "on" : null, emoji + " " + us.length);
        b.onclick = () => react(m.id, emoji);
        bar2.appendChild(b);
      });
      stack.appendChild(bar2);
    }

    if (openPicker === m.id) {
      const p = el("div", "picker");
      REACTIONS.forEach(e => { const b = el("button", null, e); b.onclick = () => react(m.id, e); p.appendChild(b); });
      stack.appendChild(p);
    }

    if (mine && i === shown.length - 1) {
      const readers = Object.entries(members)
        .filter(([u, mm]) => u !== me.uid && mm.seenAt && mm.seenAt >= m.t)
        .map(([u, mm]) => mm.name);
      if (readers.length) stack.appendChild(el("p", "seen", "👀 " + readers.join("・") + " が読んだ"));
    }

    row.appendChild(stack);
    log.appendChild(row);
  });

  markSeen();
  if (stuck) log.scrollTop = log.scrollHeight;
}

try {
  (me && me.name) ? showHome() : showSetup();
} catch (e) {
  app.innerHTML = '<div class="center"><div class="card"><h1>ごめん、うまく開けなかった</h1><p class="note">' + String(e.message) + '</p></div></div>';
}
</script>
